[package]
name = "ucb-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ucb"
path = "src/main.rs"

[dependencies]
ucb-core = { workspace = true }
ucb-crypto = { workspace = true }
ucb-discovery = { workspace = true }
ucb-clipboard = { workspace = true }
ucb-sync = { workspace = true }
ucb-files = { workspace = true }
ucb-history = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
hex = { workspace = true }
qrcode = { workspace = true }

# BG-1: Windows background service (SCM) integration. Target-specific so it is
# only pulled in when building for Windows; the root workspace manifest is
# intentionally left untouched.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
