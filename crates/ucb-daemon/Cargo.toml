[package]
name = "ucb-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ucb"
path = "src/main.rs"

# Windows: windowless launcher the login `Run` entry starts (see src/bin/ucbw.rs).
[[bin]]
name = "ucbw"
path = "src/bin/ucbw.rs"

[dependencies]
ucb-core = { workspace = true }
ucb-crypto = { workspace = true }
ucb-discovery = { workspace = true }
ucb-clipboard = { workspace = true }
ucb-sync = { workspace = true }
ucb-history = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
hex = { workspace = true }
qrcode = { workspace = true }

# BG-1: Windows login autostart (HKCU Run entry). Target-specific so it is only
# pulled in when building for Windows; 0.59 is already in the lockfile.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry"] }
